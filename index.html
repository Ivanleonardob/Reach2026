<style>

  :root {
    --teal:        #0E7C7B;
    --teal-dark:   #065A5A;
    --teal-light:  #D6EFEF;
    --teal-xlight: #EEF7F7;
    --amber:       #F5A623;
    --amber-light: #FEF3DC;
    --violet:      #7C3AED;
    --violet-light:#EDE9FE;
    --charcoal:    #2D2D2D;
    --muted:       #6B7280;
    --bg:          #F4F8F8;
    --white:       #ffffff;
    --border:      #D1E8E8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--charcoal); min-height: 100vh; }

  /* ── Header ── */
  header {
    background: var(--teal-dark);
    padding: 1.6rem 2rem 1.2rem;
    position: relative; overflow: hidden;
  }
  header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 80% 50%,#0E7C7B55 0%,transparent 70%); }
  header::after  { content:''; position:absolute; bottom:0;left:0;right:0; height:4px; background:linear-gradient(90deg,var(--amber),#FFC86A,var(--amber)); }
  .header-inner  { max-width:1100px; margin:0 auto; position:relative; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
  .header-tag    { font-size:.72rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:#B2DFDF; margin-bottom:.3rem; }
  h1             { font-family:'DM Serif Display',serif; font-size:clamp(1.6rem,3.5vw,2.4rem); color:white; line-height:1.1; }
  h1 em          { color:var(--amber); font-style:italic; }
  .header-sub    { color:#B2DFDF; font-size:.88rem; margin-top:.3rem; }

  /* ── View toggle ── */
  .view-toggle { display:flex; gap:.4rem; background:rgba(255,255,255,.1); border-radius:10px; padding:4px; }
  .view-btn {
    padding:.42rem .95rem; border-radius:7px; border:none; font-family:inherit; font-size:.82rem;
    font-weight:600; cursor:pointer; color:#B2DFDF; background:transparent; transition:all .15s;
    display:flex; align-items:center; gap:.4rem;
  }
  .view-btn.active { background:white; color:var(--teal-dark); }
  .view-btn:hover:not(.active) { color:white; }

  /* ── Legend ── */
  .legend { max-width:1100px; margin:1.1rem auto 0; padding:0 1rem; display:flex; gap:.9rem; flex-wrap:wrap; align-items:center; }
  .legend-label { font-size:.76rem; color:var(--muted); font-weight:600; }
  .legend-item  { display:flex; align-items:center; gap:.35rem; font-size:.76rem; font-weight:500; }
  .legend-dot   { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* ── Filters ── */
  .controls { max-width:1100px; margin:.7rem auto 0; padding:0 1rem; display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; }
  .controls-label { font-size:.76rem; color:var(--muted); }
  .filter-btn {
    padding:.28rem .75rem; border-radius:999px; border:1.5px solid var(--border); background:white;
    font-family:inherit; font-size:.76rem; font-weight:500; cursor:pointer; color:var(--muted); transition:all .15s;
  }
  .filter-btn:hover { border-color:var(--teal); color:var(--teal); }
  .filter-btn.active { background:var(--teal-dark); border-color:var(--teal-dark); color:white; }

  /* ── Stats ── */
  .stats { max-width:1100px; margin:.7rem auto 0; padding:0 1rem; display:flex; gap:.55rem; flex-wrap:wrap; }
  .stat-pill { background:white; border:1px solid var(--border); border-radius:8px; padding:.38rem .85rem; display:flex; gap:.4rem; align-items:center; font-size:.76rem; color:var(--muted); }
  .stat-pill strong { color:var(--teal-dark); font-size:.92rem; }

  /* ═══════════ LIST VIEW ═══════════ */
  #list-view { max-width:1100px; margin:1.1rem auto 3rem; padding:0 1rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:.85rem; }
  .month-card { background:white; border-radius:13px; border:1px solid var(--border); overflow:hidden; box-shadow:0 1px 4px #0E7C7B08; transition:box-shadow .2s; }
  .month-card:hover { box-shadow:0 4px 14px #0E7C7B16; }
  .month-header { background:var(--teal-dark); padding:.7rem 1.1rem; display:flex; align-items:baseline; gap:.5rem; }
  .month-name  { font-family:'DM Serif Display',serif; font-size:1.1rem; color:white; }
  .month-count { font-size:.7rem; color:#B2DFDF; margin-left:auto; }
  .event-list  { padding:.35rem 0; }
  .event-item  { display:grid; grid-template-columns:2.5rem 1fr; padding:.48rem 1.1rem; border-left:3px solid transparent; cursor:pointer; transition:background .1s; }
  .event-item:hover { background:var(--teal-xlight); }
  .event-item.type-idipron    { border-left-color:var(--teal); }
  .event-item.type-share      { border-left-color:var(--amber); }
  .event-item.type-bienvenida { border-left-color:var(--violet); }
  .event-day    { font-weight:700; font-size:.88rem; color:var(--teal-dark); padding-top:.05rem; }
  .event-right  { min-width:0; }
  .event-title  { font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .event-groups { font-size:.7rem; color:var(--muted); margin-top:.06rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .event-pill   { display:inline-block; font-size:.63rem; font-weight:600; padding:.07rem .42rem; border-radius:999px; margin-left:.32rem; vertical-align:middle; }
  .pill-idipron    { background:var(--teal-light); color:var(--teal-dark); }
  .pill-share      { background:var(--amber-light); color:#92400e; }
  .pill-bienvenida { background:var(--violet-light); color:#5b21b6; }
  .no-events { padding:.85rem 1.1rem; font-size:.8rem; color:var(--muted); font-style:italic; }

  /* ═══════════ CALENDAR VIEW ═══════════ */
  #calendar-view { max-width:1100px; margin:1.1rem auto 3rem; padding:0 1rem; }

  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; }
  .cal-nav-btn {
    background:white; border:1.5px solid var(--border); border-radius:8px;
    padding:.38rem .85rem; font-family:inherit; font-size:.83rem; font-weight:600;
    cursor:pointer; color:var(--teal-dark); transition:all .15s;
  }
  .cal-nav-btn:hover { background:var(--teal-dark); color:white; border-color:var(--teal-dark); }
  .cal-nav-btn:disabled { opacity:.35; cursor:default; pointer-events:none; }
  .cal-month-title { font-family:'DM Serif Display',serif; font-size:1.5rem; color:var(--teal-dark); text-align:center; }
  .cal-month-subtitle { font-size:.78rem; color:var(--muted); text-align:center; margin-top:.1rem; }

  .cal-grid {
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:1px; background:var(--border); border-radius:12px; overflow:hidden;
    box-shadow:0 2px 12px #0E7C7B10;
  }
  .cal-dow { background:var(--teal-dark); color:#B2DFDF; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; text-align:center; padding:.55rem .2rem; }

  .cal-day { background:white; min-height:100px; padding:.4rem .45rem .35rem; display:flex; flex-direction:column; gap:2px; }
  .cal-day.other-month { background:#FAFCFC; }
  .cal-day.today { background:var(--amber-light); }
  .cal-day-num { font-size:.75rem; font-weight:700; color:var(--muted); margin-bottom:2px; line-height:1; }
  .cal-day.other-month .cal-day-num { color:#C9D8D8; }
  .cal-day.today .cal-day-num { color:var(--teal-dark); }

  .cal-chip { font-size:.62rem; font-weight:600; padding:2px 4px; border-radius:4px; line-height:1.3; cursor:pointer; transition:opacity .12s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-chip:hover { opacity:.75; }
  .cal-chip.type-idipron    { background:var(--teal-light); color:var(--teal-dark); }
  .cal-chip.type-share      { background:var(--amber-light); color:#92400e; }
  .cal-chip.type-bienvenida { background:var(--violet-light); color:#5b21b6; }
  .cal-chip-more { font-size:.6rem; color:var(--muted); font-weight:500; padding:1px 3px; cursor:pointer; }
  .cal-chip-more:hover { color:var(--teal); }

  /* Month panel */
  .cal-month-events { margin-top:1rem; background:white; border-radius:12px; border:1px solid var(--border); overflow:hidden; }
  .cal-month-events-header { background:var(--teal-xlight); padding:.55rem 1.1rem; font-size:.78rem; font-weight:700; color:var(--teal-dark); border-bottom:1px solid var(--border); }
  .cal-event-row { display:grid; grid-template-columns:3.5rem 2.8rem 1fr; align-items:start; padding:.5rem 1.1rem; border-bottom:1px solid #F0F7F7; cursor:pointer; transition:background .1s; gap:.5rem; }
  .cal-event-row:last-child { border-bottom:none; }
  .cal-event-row:hover { background:var(--teal-xlight); }
  .cal-event-row-day   { font-weight:700; font-size:.83rem; color:var(--teal-dark); padding-top:2px; }
  .cal-event-row-badge { font-size:.62rem; font-weight:700; padding:2px 5px; border-radius:4px; text-align:center; line-height:1.4; }
  .cal-event-row-title  { font-size:.82rem; font-weight:600; }
  .cal-event-row-groups { font-size:.72rem; color:var(--muted); margin-top:1px; }
  .cal-no-events { padding:1.1rem; font-size:.82rem; color:var(--muted); font-style:italic; }

  /* ── Modal ── */
  .overlay { position:fixed; inset:0; background:rgba(6,90,90,.45); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; pointer-events:none; transition:opacity .2s; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .modal { background:white; border-radius:16px; width:100%; max-width:500px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(6,90,90,.25); transform:translateY(10px); transition:transform .2s; }
  .overlay.open .modal { transform:translateY(0); }
  .modal-header { padding:1.2rem 1.3rem .85rem; background:var(--teal-dark); border-radius:16px 16px 0 0; position:relative; }
  .modal-date  { font-size:.72rem; color:#B2DFDF; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.22rem; }
  .modal-title { font-family:'DM Serif Display',serif; font-size:1.25rem; color:white; line-height:1.2; }
  .modal-close { position:absolute; top:.85rem; right:.85rem; background:rgba(255,255,255,.15); border:none; color:white; width:27px; height:27px; border-radius:50%; cursor:pointer; font-size:.95rem; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .modal-close:hover { background:rgba(255,255,255,.3); }
  .modal-body  { padding:1rem 1.3rem 1.3rem; }
  .modal-group { margin-bottom:.75rem; padding:.75rem .85rem; background:var(--teal-xlight); border-radius:9px; border-left:3px solid var(--teal); }
  .modal-group-name { font-weight:700; font-size:.86rem; color:var(--teal-dark); margin-bottom:.3rem; }
  .modal-topic { font-size:.8rem; color:var(--muted); margin-bottom:.35rem; font-style:italic; }
  .modal-role-row { font-size:.8rem; color:var(--charcoal); margin-bottom:.15rem; display:flex; gap:.38rem; }
  .modal-role-label { font-weight:600; color:var(--teal-dark); min-width:86px; flex-shrink:0; }
  .modal-section-label { font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }

  .hidden { display:none !important; }
</style>
</head>

const MONTHS  = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MONTHS_ES = MONTHS.map(m => m.toLowerCase());
const DOWS    = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

function classify(a) {
  if (a.includes("Bienvenida")) return "bienvenida";
  if (a.includes("SHARE"))      return "share";
  return "idipron";
}

function buildAggregated(filter) {
  const dm = {};
  RAW.forEach(r => {
    if (filter !== "all" && classify(r.activity) !== filter) return;
    if (!dm[r.date]) dm[r.date] = {};
    if (!dm[r.date][r.activity]) dm[r.date][r.activity] = {activity:r.activity, date:r.date, groups:[], detail:[]};
    dm[r.date][r.activity].groups.push(r.group);
    if (r.topic) dm[r.date][r.activity].detail.push(r);
  });
  const res = {};
  Object.keys(dm).forEach(d => { res[d] = Object.values(dm[d]); });
  return res;
}

let activeFilter = "all";
let currentView  = "list";
let calMonth     = 4; // 0-indexed May

// Stats
function renderStats() {
  const i = RAW.filter(e=>classify(e.activity)==="idipron").length;
  const s = RAW.filter(e=>classify(e.activity)==="share").length;
  const b = RAW.filter(e=>classify(e.activity)==="bienvenida").length;
  document.getElementById("stats").innerHTML =
    `<div class="stat-pill"><strong>${RAW.length}</strong> entradas totales</div>
     <div class="stat-pill"><strong>14</strong> grupos</div>
     <div class="stat-pill"><strong>${i}</strong> visitas IDIPRON</div>
     <div class="stat-pill"><strong>${s}</strong> activaciones SHARE</div>
     <div class="stat-pill"><strong>${b}</strong> bienvenidas</div>`;
}

// View
function setView(v) {
  currentView = v;
  document.getElementById("list-view").classList.toggle("hidden", v!=="list");
  document.getElementById("calendar-view").classList.toggle("hidden", v!=="calendar");
  document.getElementById("btn-list").classList.toggle("active", v==="list");
  document.getElementById("btn-cal").classList.toggle("active", v==="calendar");
  v==="list" ? renderList() : renderCalendar();
}

// LIST
function renderList() {
  const agg  = buildAggregated(activeFilter);
  const grid = document.getElementById("list-view");
  grid.innerHTML = "";
  for (let m = 4; m <= 11; m++) {
    const evs = Object.entries(agg)
      .filter(([d]) => parseInt(d.split("-")[1])-1 === m)
      .sort(([a],[b]) => a.localeCompare(b))
      .flatMap(([,e]) => e);

    const card = document.createElement("div");
    card.className = "month-card";
    card.innerHTML = `<div class="month-header"><div class="month-name">${MONTHS[m]} 2026</div><div class="month-count">${evs.length} evento${evs.length!==1?"s":""}</div></div><div class="event-list"></div>`;
    const list = card.querySelector(".event-list");

    if (!evs.length) {
      list.innerHTML = `<div class="no-events">Sin actividades con el filtro seleccionado.</div>`;
    } else {
      evs.forEach(ev => {
        const type = classify(ev.activity);
        const day  = parseInt(ev.date.split("-")[2]);
        const title = type==="idipron" ? "Visita IDIPRON" : type==="share" ? "Activación SHARE" : "Bienvenida de Nuevos";
        const pill  = ev.activity.includes("SERVITA") ? `<span class="event-pill pill-idipron">SERVITA</span>`
                    : ev.activity.includes("LA 27")   ? `<span class="event-pill pill-idipron">LA 27</span>`
                    : type==="share"                   ? `<span class="event-pill pill-share">SHARE</span>`
                    :                                    `<span class="event-pill pill-bienvenida">Nuevos</span>`;
        const item = document.createElement("div");
        item.className = `event-item type-${type}`;
        item.innerHTML = `<div class="event-day">${day}</div><div class="event-right"><div class="event-title">${title}${pill}</div><div class="event-groups">${ev.groups.slice(0,3).join(" · ")}${ev.groups.length>3?` +${ev.groups.length-3}`:""}</div></div>`;
        item.addEventListener("click", () => openModal(ev));
        list.appendChild(item);
      });
    }
    grid.appendChild(card);
  }
}

// CALENDAR
function calNav(dir) {
  calMonth = Math.max(4, Math.min(11, calMonth + dir));
  renderCalendar();
}

function renderCalendar() {
  const agg = buildAggregated(activeFilter);
  const m = calMonth, y = 2026;

  document.getElementById("cal-prev").disabled = m <= 4;
  document.getElementById("cal-next").disabled = m >= 11;

  const monthEvs = Object.entries(agg)
    .filter(([d]) => parseInt(d.split("-")[1])-1 === m)
    .sort(([a],[b]) => a.localeCompare(b));
  const total = monthEvs.reduce((s,[,e]) => s+e.length, 0);

  document.getElementById("cal-title").textContent = `${MONTHS[m]} ${y}`;
  document.getElementById("cal-sub").textContent   = `${total} actividad${total!==1?"es":""} este mes`;

  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev  = new Date(y, m, 0).getDate();
  const totalCells  = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  const today       = new Date();

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  DOWS.forEach(d => {
    const el = document.createElement("div");
    el.className = "cal-dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement("div");
    cell.className = "cal-day";

    let dayNum, thisMonth = true;
    if (i < firstDay) { dayNum = daysInPrev - firstDay + i + 1; thisMonth = false; cell.classList.add("other-month"); }
    else if (i >= firstDay + daysInMonth) { dayNum = i - firstDay - daysInMonth + 1; thisMonth = false; cell.classList.add("other-month"); }
    else { dayNum = i - firstDay + 1; }

    if (thisMonth && today.getFullYear()===y && today.getMonth()===m && today.getDate()===dayNum)
      cell.classList.add("today");

    const numEl = document.createElement("div");
    numEl.className = "cal-day-num";
    numEl.textContent = dayNum;
    cell.appendChild(numEl);

    if (thisMonth) {
      const ds   = `${y}-${String(m+1).padStart(2,"0")}-${String(dayNum).padStart(2,"0")}`;
      const devs = agg[ds] || [];
      devs.slice(0, 2).forEach(ev => {
        const type  = classify(ev.activity);
        const label = type==="idipron" ? (ev.activity.includes("SERVITA") ? "IDIPRON S" : "IDIPRON LA27")
                    : type==="share"   ? "Act. SHARE" : "Bienvenida";
        const chip  = document.createElement("div");
        chip.className = `cal-chip type-${type}`;
        chip.textContent = label;
        chip.title = `${ev.groups.length} grupo${ev.groups.length!==1?"s":""}`;
        chip.addEventListener("click", e => { e.stopPropagation(); openModal(ev); });
        cell.appendChild(chip);
      });
      if (devs.length > 2) {
        const more = document.createElement("div");
        more.className = "cal-chip-more";
        more.textContent = `+${devs.length-2} más`;
        more.addEventListener("click", e => { e.stopPropagation(); openDayPanel(ds, devs); });
        cell.appendChild(more);
      }
    }
    grid.appendChild(cell);
  }

  renderMonthPanel(monthEvs);
}

function openDayPanel(ds, devs) {
  // Show all events for a day inline in the modal
  const [y, mo, d] = ds.split("-");
  const label = `${parseInt(d)} de ${MONTHS_ES[parseInt(mo)-1]} de ${y}`;
  document.getElementById("modal-date").textContent = label.toUpperCase();
  document.getElementById("modal-title").textContent = "Actividades del día";

  let html = `<div class="modal-section-label">${devs.length} actividad${devs.length!==1?"es":""}</div>`;
  devs.forEach(ev => {
    const type = classify(ev.activity);
    const title = type==="idipron" ? "Visita IDIPRON · "+(ev.activity.includes("SERVITA")?"SERVITA":"LA 27")
                : type==="share"   ? "Activación SHARE" : "Bienvenida de Nuevos";
    html += `<div class="modal-group" style="cursor:pointer" onclick='void(0)'>
      <div class="modal-group-name" style="color:var(--charcoal)">${title}</div>
      <div style="font-size:.78rem;color:var(--muted);margin-top:.2rem">${ev.groups.join(", ")}</div>
    </div>`;
  });
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
}

function renderMonthPanel(monthEvs) {
  const panel = document.getElementById("cal-month-events");
  if (!monthEvs.length) {
    panel.innerHTML = `<div class="cal-month-events-header">Actividades del mes</div><div class="cal-no-events">Sin actividades con el filtro seleccionado.</div>`;
    return;
  }
  const total = monthEvs.reduce((s,[,e]) => s+e.length, 0);
  let html = `<div class="cal-month-events-header">Todas las actividades del mes (${total})</div>`;
  monthEvs.forEach(([ds, evs]) => {
    const day = parseInt(ds.split("-")[2]);
    const dow = DOWS[new Date(ds).getDay()];
    evs.forEach(ev => {
      const type  = classify(ev.activity);
      const bc    = type==="idipron" ? "pill-idipron" : type==="share" ? "pill-share" : "pill-bienvenida";
      const bl    = type==="idipron" ? (ev.activity.includes("SERVITA")?"SERVITA":"LA 27") : type==="share" ? "SHARE" : "Nuevos";
      const title = type==="idipron" ? "Visita IDIPRON" : type==="share" ? "Activación SHARE" : "Bienvenida de Nuevos";
      const id    = JSON.stringify({date:ev.date, activity:ev.activity});
      html += `<div class="cal-event-row" onclick='openByRef(${id.replace(/"/g,"&quot;")})'>
        <div class="cal-event-row-day">${dow} ${day}</div>
        <div class="cal-event-row-badge event-pill ${bc}">${bl}</div>
        <div>
          <div class="cal-event-row-title">${title}</div>
          <div class="cal-event-row-groups">${ev.groups.slice(0,4).join(" · ")}${ev.groups.length>4?` +${ev.groups.length-4}`:""}</div>
        </div>
      </div>`;
    });
  });
  panel.innerHTML = html;
}

function openByRef(ref) {
  const agg = buildAggregated(activeFilter);
  const ev  = (agg[ref.date]||[]).find(e => e.activity === ref.activity);
  if (ev) openModal(ev);
}
window.openByRef = function(ref) {
  const agg = buildAggregated(activeFilter);
  const ev  = (agg[ref.date]||[]).find(e => e.activity === ref.activity);
  if (ev) openModal(ev);
};

// Modal
function openModal(ev) {
  const type = classify(ev.activity);
  const tl   = type==="idipron" ? "Visita IDIPRON · "+(ev.activity.includes("SERVITA")?"SERVITA":"LA 27")
              : type==="share"  ? "Activación Evangelismo SHARE" : "Bienvenida de Nuevos";
  const [y,mo,d] = ev.date.split("-");
  document.getElementById("modal-date").textContent  = `${parseInt(d)} DE ${MONTHS_ES[parseInt(mo)-1].toUpperCase()} DE ${y}`;
  document.getElementById("modal-title").textContent = tl;

  let html = `<div class="modal-section-label">Grupos participantes</div>`;
  if (type==="idipron" && ev.detail.length) {
    ev.detail.forEach(d => {
      html += `<div class="modal-group">
        <div class="modal-group-name">👥 ${d.group}</div>
        ${d.topic ? `<div class="modal-topic">📖 ${d.topic}</div>` : ""}
        ${d.rh    ? `<div class="modal-role-row"><span class="modal-role-label">Rompehielos:</span><span>${d.rh}</span></div>`  : ""}
        ${d.act   ? `<div class="modal-role-row"><span class="modal-role-label">Actividad:</span><span>${d.act}</span></div>`   : ""}
        ${d.msg   ? `<div class="modal-role-row"><span class="modal-role-label">Mensaje:</span><span>${d.msg}</span></div>`     : ""}
      </div>`;
    });
  } else {
    ev.groups.forEach(g => { html += `<div class="modal-group"><div class="modal-group-name">👥 ${g}</div></div>`; });
  }
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
}

document.getElementById("modal-close").addEventListener("click", () => document.getElementById("overlay").classList.remove("open"));
document.getElementById("overlay").addEventListener("click", e => { if (e.target===e.currentTarget) e.currentTarget.classList.remove("open"); });

// Filters
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    currentView==="list" ? renderList() : renderCalendar();
  });
});

renderStats();
renderList();
